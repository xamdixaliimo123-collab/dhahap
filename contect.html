<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Aura Gold & Co.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col min-h-screen bg-slate-950 text-slate-100">

    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-amber-500/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-amber-400 flex items-center justify-center text-slate-950 text-lg font-bold shadow-md">✨</div>
                    <span class="text-xl font-bold text-amber-400 brand-font tracking-widest">AURA GOLD</span>
                </a>
                <nav class="hidden md:flex space-x-8 font-medium text-sm">
                    <a href="home.html" class="text-slate-200 hover:text-amber-400 transition">Home</a>
                    <a href="about.html" class="text-slate-200 hover:text-amber-400 transition">About Us</a>
                    <a href="services.html" class="text-slate-200 hover:text-amber-400 transition">Services</a>
                    <a href="contact.html" class="text-amber-400 font-semibold border-b-2 border-amber-400 pb-0.5">Contact</a>
                </nav>
                <a href="contact.html" class="hidden md:inline-block bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-5 py-2 rounded-full shadow-md text-sm transition">
                    Get in Touch
                </a>
            </div>
        </div>
    </header>

    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow">
        <div class="max-w-xl mx-auto bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
            <h1 class="text-2xl font-bold text-white text-center">Contact Our Jewelry Experts</h1>
            <p class="text-slate-400 text-center mt-2 text-xs">Have a custom order or inquiry? Send us a message today.</p>

            <form class="mt-6 space-y-4" onsubmit="event.preventDefault(); alert('Thank you for reaching out!');">
                <div>
                    <label class="block text-xs font-semibold text-amber-300">Full Name</label>
                    <input type="text" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-amber-400" placeholder="e.g. John Doe" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-300">Email Address</label>
                    <input type="email" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-amber-400" placeholder="example@domain.com" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-300">Message / Details</label>
                    <textarea rows="4" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-amber-400" placeholder="Describe your request..." required></textarea>
                </div>
                <button type="submit" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-3 rounded-lg text-sm transition">
                    Submit Inquiry
                </button>
            </form>
        </div>
    </section>

    <footer class="bg-slate-950 border-t border-slate-800 mt-auto py-8 text-center text-sm text-slate-400">
        &copy; 2026 Aura Gold & Co. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
